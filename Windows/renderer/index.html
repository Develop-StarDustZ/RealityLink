<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"><title>RealityLink</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="shell"><aside><header class="brand"><img src="../resources/icon.png" alt=""><div><b>RealityLink</b><small>Secure tunnel client</small></div></header><div class="side-actions"><button id="importButton">导入链接</button><button id="addButton" class="icon" title="添加节点">＋</button><button id="latencyButton" class="icon" title="测试延迟">◷</button></div><div id="profiles" class="profiles"></div><footer><button id="settingsButton" class="ghost">设置</button><span id="nodeCount">0 个节点</span></footer></aside>
<main><nav><button class="tab active" data-tab="connection">连接</button><button class="tab" data-tab="logs">日志</button></nav><section id="connectionTab" class="tab-content"><div class="status-orb" id="statusOrb"><span>✦</span></div><h1 id="statusTitle">未连接</h1><p id="statusSubtitle">选择一个节点开始连接</p><article id="profileCard" class="card empty">还没有节点，请先导入节点或订阅链接</article><button id="connectButton" class="primary" data-i18n-action="connect" disabled>连接</button><p id="errorMessage" class="error"></p></section><section id="logsTab" class="tab-content hidden"><div class="log-head"><h2>运行日志</h2><button id="clearLogs" class="ghost">清空显示</button></div><pre id="logs"></pre></section></main></div>
<dialog id="importDialog"><form method="dialog"><h2>导入链接</h2><textarea id="importURL" rows="5" placeholder="vless://, vmess://, trojan://, ss://, hysteria2://, tuic://, sub:// or https://..."></textarea><p class="hint">支持单节点链接，以及 HTTP(S) / sub:// 订阅。</p><p class="dialogError"></p><div class="dialog-actions"><button type="button" class="ghost storeButton">购买节点</button><button value="cancel" class="ghost">取消</button><button id="confirmImport" value="default" class="primary">导入</button></div></form></dialog>
<dialog id="profileDialog"><form method="dialog"><h2 id="editorTitle">添加节点</h2><input id="profileID" type="hidden"><div class="form-grid">
<label>协议<select id="proxyProtocol"><option value="vless">VLESS</option><option value="vmess">VMess</option><option value="trojan">Trojan</option><option value="shadowsocks">Shadowsocks</option><option value="hysteria2">Hysteria2</option><option value="tuic">TUIC</option></select></label><label>名称<input id="name"></label><label>服务器<input id="server"></label><label>端口<input id="port" type="number" value="443"></label>
<label data-field="uuid">UUID<input id="uuid"></label><label data-field="password">密码<input id="password" type="password"></label><label data-field="security">安全<select id="security"><option value="reality">Reality</option><option value="tls">TLS</option><option value="none">None</option></select></label><label data-field="transport">传输<select id="transport"><option value="tcp">TCP</option><option value="ws">WebSocket</option><option value="grpc">gRPC</option><option value="http">HTTP/2</option></select></label>
<label data-field="serverName">SNI<input id="serverName"></label><label data-field="publicKey">Reality 公钥<input id="publicKey"></label><label data-field="shortID">Short ID<input id="shortID"></label><label data-field="fingerprint">uTLS 指纹<input id="fingerprint" value="chrome"></label><label data-field="flow">Flow<input id="flow"></label><label data-field="encryption">加密方式<input id="encryption" placeholder="auto / aes-128-gcm / chacha20-poly1305"></label><label data-field="alterID">Alter ID<input id="alterID" type="number" value="0"></label><label data-field="transportHost">Host<input id="transportHost"></label><label data-field="transportPath">Path<input id="transportPath"></label><label data-field="serviceName">gRPC Service Name<input id="serviceName"></label><label data-field="alpn">ALPN<input id="alpn" placeholder="h2,http/1.1"></label><label data-field="obfuscation">混淆<select id="obfuscation"><option value="">None</option><option value="salamander">Salamander</option></select></label><label data-field="obfuscationPassword">混淆密码<input id="obfuscationPassword" type="password"></label><label data-field="congestionControl">拥塞控制<input id="congestionControl" value="cubic"></label><label data-field="udpRelayMode">UDP Relay<input id="udpRelayMode" value="native"></label><label class="check" data-field="allowInsecure"><input id="allowInsecure" type="checkbox">允许不安全证书</label>
</div><p class="dialogError"></p><div class="dialog-actions"><button type="button" class="ghost storeButton">购买节点</button><button value="cancel" class="ghost">取消</button><button id="confirmProfile" value="default" class="primary">保存</button></div></form></dialog>
<dialog id="settingsDialog"><form method="dialog"><h2>设置</h2><label>语言<select id="languageSelect"><option value="en">English</option><option value="zh">中文</option><option value="ru">Русский</option></select></label><label>自定义 sing-box.exe 路径<input id="corePath" placeholder="留空使用应用内置版本"></label><p class="hint">首次 TUN 连接会请求 Windows UAC 授权；保持应用运行时切换节点无需重新授权。</p><div class="dialog-actions"><button type="button" class="ghost storeButton">购买节点</button><button value="cancel" class="ghost">取消</button><button id="confirmSettings" value="default" class="primary">保存</button></div></form></dialog><script src="i18n.js"></script><script src="renderer.js"></script></body></html>
