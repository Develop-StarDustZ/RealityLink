name: Linux CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Linux/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run prepare-core
      - run: npx electron-builder --linux AppImage deb --x64 --publish never
      - run: bash Scripts/write-checksums.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RealityLink-linux-x64
          path: |
            Linux/dist/*.AppImage
            Linux/dist/*.deb
            Linux/dist/*.sha256
